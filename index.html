</table></td></tr></table>
</div>
<div style="margin-top:28px"><button id="copyBtn" onclick="copySignature()" style="font:600 17px Arial;padding:12px 18px;border:1px solid #999;border-radius:10px;background:#f4f4f4;color:#111;">Copy Signature</button>
<span id="status" style="margin-left:10px;font:14px Arial;color:#555;"></span></div>
<script>
async function copySignature(){
 const el=document.getElementById('sig'), status=document.getElementById('status');
 const html=el.innerHTML;
 const text=el.innerText;
 try{
   if(navigator.clipboard && window.ClipboardItem){
     await navigator.clipboard.write([new ClipboardItem({
       'text/html': new Blob([html],{type:'text/html'}),
       'text/plain': new Blob([text],{type:'text/plain'})
     })]);
     status.textContent='Copied — paste into Outlook.';
   } else { throw new Error('rich clipboard unavailable'); }
 }catch(e){
   const r=document.createRange(); r.selectNodeContents(el);
   const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
   const ok=document.execCommand('copy'); s.removeAllRanges();
   status.textContent=ok?'Copied — paste into Outlook.':'Copy failed — use Safari.';
 }
}
</script></body></html>
