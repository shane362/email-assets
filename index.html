<script>
async function copySignature(){const el=document.getElementById('sig'),status=document.getElementById('status'),html=el.innerHTML,text=el.innerText;try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);status.textContent='Copied — paste into Outlook.';}else{throw new Error();}}catch(e){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();status.textContent=ok?'Copied — paste into Outlook.':'Copy failed — use Safari.';}}
